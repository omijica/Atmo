# Configuration for Areas/Zones
# Each area can have its own ambient settings and boundaries.
# Example:
# areas:
#   spawn:
#     world: world
#     pos1:
#       x: 100
#       y: 60
#       z: 100
#     pos2:
#       x: 200
#       y: 80
#       z: 200
#     ambient:
#       # Whether ambient sounds are enabled globally
#       enabled: true
#       # The default ambient profile to use (defined in ambient.yml)
#       name: field
#    music:
#       # Whether background music is enabled
#       enabled: true
#       # The sound name for music
#       name: "minecraft:custom.musc"
#       # Volume level (0-100)
#       volume: 50
#       # Duration of the music track in seconds
#       duration: 300

areas: {}
