# ==============================================================================
#                              Atmo - blocksound.yml
# ==============================================================================
# This configuration file manages block-bound and position-bound spatial audio.
# BlockSound allows sounds to play dynamically near entities (such as Armor Stands
# or ItemsAdder furniture) or at specific fixed coordinate positions in the world.
# ==============================================================================

blockSound:

  # ----------------------------------------------------------------------------
  # ENTITIES SECTION
  # Detects nearby entities around the player and plays ambient sounds from them.
  # ----------------------------------------------------------------------------
  entities:
    # Example 1: Vanilla Armor Stand with CustomModelData
    radio:
      # Detection type:
      # - ENTITY: Standard Minecraft Bukkit entity check.
      # - ITEMSADDER: Custom furniture item check using the ItemsAdder plugin.
      type: "ENTITY"
      # Bukkit EntityType name (e.g., ARMOR_STAND, ITEM_FRAME, VILLAGER).
      entity: "ARMOR_STAND"
      # CustomModelData on the entity's helmet item (0 disables this filter).
      customModelData: 5
      # Detection radius in blocks around the player.
      radius: 5.0
      # Sound key to play (Minecraft sound or custom resource pack sound).
      sound: "minecraft:block.note_block.chime"
      # Probability of playing the sound when delay expires (0.0 to 1.0).
      chance: 0.3
      # Minimum delay in seconds before triggering another play check.
      min_delay: 30
      # Maximum delay in seconds before triggering another play check.
      max_delay: 70
      # Sound volume multiplier (1.0 = normal volume).
      volume: 0.4
      # Base pitch for playback (1.0 = normal speed/pitch).
      pitchBase: 1.0
      # Maximum random variation added or subtracted from pitchBase.
      # Resulting pitch formula: pitchBase + random(-pitchVariation, +pitchVariation) (0 to disable)
      pitchVariation: 0.2
      # Enable or disable this entity entry.
      enabled: true

    # Example 2: ItemsAdder Furniture Entity
    radio2:
      type: "ITEMSADDER"
      # ItemsAdder furniture identifier (namespace:id).
      entity: "lixar:radio"

      radius: 5.0
      sound: "minecraft:block.note_block.chime"
      chance: 0.3
      min_delay: 30
      max_delay: 70
      volume: 0.4
      pitchBase: 1.0
      pitchVariation: 0.2
      enabled: true

  # ----------------------------------------------------------------------------
  # POSITIONS SECTION
  # Plays spatial sounds from fixed coordinates in the world when players enter radius.
  # ----------------------------------------------------------------------------
  positions:
    # Example entry name for position-based sounds (e.g. ambient cave voices)
    voices:
      # Sound key to play.
      sound: "minecraft:ambient.cave"
      # Distance threshold in blocks from target location to trigger audio.
      radius: 5.0
      # Chance (0.0 to 1.0) to trigger per interval check.
      chance: 0.3
      # Minimum interval delay (in seconds) between play checks.
      min_delay: 30
      # Maximum interval delay (in seconds) between play checks.
      max_delay: 70
      # Audio playback volume.
      volume: 0.4
      # Base pitch.
      pitchBase: 1.0
      # Pitch variation width.
      pitchVariation: 0.2
      # Enable or disable this position entry.
      enabled: true
      # Target coordinates formatted as: "world_name, x, y, z" You can add them using /atmo addloc <name>
      locations:
        - "world, 100, 60, 100"
        - "world, 100, 60, 110"